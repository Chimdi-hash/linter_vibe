<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinterVibe - GenLayer Contract Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background-color: #f5f5f5;
            color: #000000;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 60px 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 12px;
            color: #000000;
        }

        .subtitle {
            font-size: 16px;
            color: #666666;
            font-weight: 400;
            line-height: 1.5;
        }

        .divider {
            height: 1px;
            background-color: #e0e0e0;
            margin: 40px 0;
        }

        .input-section {
            margin-bottom: 40px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            min-width: 250px;
            padding: 14px 16px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Monaco', 'Courier New', monospace;
            background-color: #fafafa;
            color: #000000;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #000000;
            background-color: #ffffff;
        }

        .input-group input::placeholder {
            color: #999999;
        }

        button {
            padding: 14px 28px;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        button:hover:not(:disabled) {
            background-color: #1a1a1a;
            border-color: #1a1a1a;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Loading State */
        .loading-indicator {
            display: none;
            text-align: center;
            padding: 40px 20px;
            margin: 30px 0;
        }

        .loading-indicator.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid #e0e0e0;
            border-top: 2px solid #000000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            display: inline-block;
            vertical-align: middle;
            color: #666666;
            font-size: 14px;
        }

        /* Error State */
        .error-container {
            display: none;
            background-color: #fff5f5;
            border: 1px solid #ffcccc;
            border-radius: 6px;
            padding: 20px;
            margin: 30px 0;
        }

        .error-container.active {
            display: block;
        }

        .error-header {
            color: #d32f2f;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .error-message {
            color: #c62828;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Results Section */
        .results-container {
            display: none;
            margin-top: 40px;
        }

        .results-container.active {
            display: block;
        }

        .contract-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid #e0e0e0;
        }

        .contract-info {
            flex: 1;
        }

        .contract-address-label {
            font-size: 12px;
            color: #999999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .contract-address {
            font-size: 14px;
            font-family: 'Monaco', 'Courier New', monospace;
            color: #000000;
            word-break: break-all;
        }

        .badge {
            display: inline-block;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid #c8e6c9;
        }

        .badge.error {
            background-color: #ffebee;
            color: #d32f2f;
            border-color: #ffcdd2;
        }

        /* Analysis Results */
        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .analysis-card {
            padding: 24px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background-color: #fafafa;
        }

        .card-title {
            font-size: 13px;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .card-value {
            font-size: 32px;
            font-weight: 700;
            color: #000000;
        }

        .card-value.warning {
            color: #f57c00;
        }

        .card-value.error {
            color: #d32f2f;
        }

        .card-value.success {
            color: #2e7d32;
        }

        /* Results List */
        .results-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            background-color: #e0e0e0;
            border-radius: 50%;
        }

        .section-icon.error {
            background-color: #ffebee;
            color: #d32f2f;
        }

        .section-icon.warning {
            background-color: #fff3e0;
            color: #f57c00;
        }

        .results-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .results-list li {
            padding: 12px 16px;
            margin-bottom: 8px;
            background-color: #f5f5f5;
            border-left: 3px solid #e0e0e0;
            border-radius: 2px;
            font-size: 13px;
            line-height: 1.5;
            color: #333333;
        }

        .results-list li.error {
            border-left-color: #d32f2f;
            background-color: #fff5f5;
            color: #c62828;
        }

        .results-list li.warning {
            border-left-color: #f57c00;
            background-color: #fff8f0;
            color: #e65100;
        }

        .empty-state {
            padding: 16px;
            background-color: #fafafa;
            border-left: 3px solid #e0e0e0;
            border-radius: 2px;
            color: #999999;
            font-size: 13px;
            font-style: italic;
        }

        /* Info Section */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 24px;
            padding: 16px;
            background-color: #fafafa;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }

        .info-item {
            font-size: 12px;
        }

        .info-label {
            color: #999999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info-value {
            color: #000000;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            word-break: break-all;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 40px 24px;
            }

            h1 {
                font-size: 32px;
            }

            .input-group {
                flex-direction: column;
            }

            .input-group input {
                min-width: 100%;
            }

            .analysis-grid {
                grid-template-columns: 1fr;
            }

            .contract-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>LinterVibe</h1>
            <p class="subtitle">Code quality analyzer for GenLayer contracts. Check decorators, detect non-deterministic
                functions, and ensure deployment-ready code.</p>
        </header>

        <div class="divider"></div>

        <!-- Input Section -->
        <section class="input-section">
            <div class="input-group">
                <input type="text" id="contractAddress" placeholder="0x1234567890123456789012345678901234567890"
                    autocomplete="off">
                <button id="analyzeBtn" onclick="analyzeContract()">Vibe Check Contract</button>
            </div>
        </section>

        <!-- Loading Indicator -->
        <div class="loading-indicator" id="loadingIndicator">
            <div class="spinner"></div>
            <span class="loading-text">Fetching contract code from GenLayer network...</span>
        </div>

        <!-- Error Container -->
        <div class="error-container" id="errorContainer">
            <div class="error-header">Unable to Analyze Contract</div>
            <div class="error-message" id="errorMessage"></div>
        </div>

        <!-- Results Section -->
        <div class="results-container" id="resultsContainer">
            <!-- Contract Header -->
            <div class="contract-header" id="contractHeader"></div>

            <div class="divider"></div>

            <!-- Analysis Cards -->
            <div class="analysis-grid" id="analysisGrid"></div>

            <!-- Critical Errors -->
            <div class="results-section" id="errorsSection" style="display: none;">
                <div class="section-title">
                    <div class="section-icon error">⚠</div>
                    Critical Errors
                </div>
                <ul class="results-list" id="errorsList"></ul>
            </div>

            <!-- Warnings/Suggestions -->
            <div class="results-section" id="warningsSection" style="display: none;">
                <div class="section-title">
                    <div class="section-icon warning">💡</div>
                    Suggestions
                </div>
                <ul class="results-list" id="warningsList"></ul>
            </div>

            <!-- Additional Info -->
            <div class="results-section">
                <div class="section-title">Contract Details</div>
                <div class="info-grid" id="infoGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';

        // Handle Enter key in input field
        document.getElementById('contractAddress').addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                analyzeContract();
            }
        });

        async function analyzeContract() {
            const address = document.getElementById('contractAddress').value.trim();

            // Validate address format
            if (!address) {
                showError('Please enter a contract address.');
                return;
            }

            if (!/^0x[a-fA-F0-9]{40}$/.test(address)) {
                showError('Invalid contract address format. Must be 0x-prefixed 40-character hex string.');
                return;
            }

            // Clear previous results
            hideError();
            hideResults();
            showLoading();

            // Disable button during request
            document.getElementById('analyzeBtn').disabled = true;

            try {
                // Make API request with the actual address
                const response = await fetch(
                    `${API_BASE_URL}/api/analyze-contract?address=${encodeURIComponent(address)}`
                );

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Failed to analyze contract');
                }

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                console.error('Error:', error);
                showError(error.message || 'Failed to fetch or analyze contract. Ensure the backend API is running and the address is correct.');
            } finally {
                hideLoading();
                document.getElementById('analyzeBtn').disabled = false;
            }
        }

        function showLoading() {
            document.getElementById('loadingIndicator').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingIndicator').classList.remove('active');
        }

        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            document.getElementById('errorMessage').textContent = message;
            errorContainer.classList.add('active');
        }

        function hideError() {
            document.getElementById('errorContainer').classList.remove('active');
        }

        function hideResults() {
            document.getElementById('resultsContainer').classList.remove('active');
        }

        function displayResults(data) {
            // Display contract header
            displayContractHeader(data.contract_address, data.analysis.is_valid);

            // Display analysis cards
            displayAnalysisCards(data.analysis);

            // Display errors
            if (data.analysis.errors.length > 0) {
                displayErrors(data.analysis.errors);
            }

            // Display warnings
            if (data.analysis.warnings.length > 0) {
                displayWarnings(data.analysis.warnings);
            }

            // Display additional info
            displayInfo(data.analysis.info);

            // Show results container
            document.getElementById('resultsContainer').classList.add('active');
        }

        function displayContractHeader(address, isValid) {
            const contractHeader = document.getElementById('contractHeader');
            const badge = isValid
                ? '<div class="badge">✓ Successfully Read from Network</div>'
                : '<div class="badge error">⚠ Issues Found</div>';

            contractHeader.innerHTML = `
                <div class="contract-info">
                    <div class="contract-address-label">Contract Address</div>
                    <div class="contract-address">${address}</div>
                </div>
                ${badge}
            `;
        }

        function displayAnalysisCards(analysis) {
            const grid = document.getElementById('analysisGrid');
            const errorCount = analysis.errors.length;
            const warningCount = analysis.warnings.length;
            const functionCount = analysis.info.functions ? analysis.info.functions.length : 0;

            const errorStatusClass = errorCount > 0 ? 'error' : 'success';
            const warningStatusClass = warningCount > 0 ? 'warning' : 'success';

            grid.innerHTML = `
                <div class="analysis-card">
                    <div class="card-title">Critical Errors</div>
                    <div class="card-value ${errorStatusClass}">${errorCount}</div>
                </div>
                <div class="analysis-card">
                    <div class="card-title">Suggestions</div>
                    <div class="card-value ${warningStatusClass}">${warningCount}</div>
                </div>
                <div class="analysis-card">
                    <div class="card-title">Functions</div>
                    <div class="card-value">${functionCount}</div>
                </div>
            `;
        }

        function displayErrors(errors) {
            const errorsSection = document.getElementById('errorsSection');
            const errorsList = document.getElementById('errorsList');

            if (errors.length > 0) {
                errorsList.innerHTML = errors.map(error => `
                    <li class="error">${escapeHtml(error)}</li>
                `).join('');
                errorsSection.style.display = 'block';
            }
        }

        function displayWarnings(warnings) {
            const warningsSection = document.getElementById('warningsSection');
            const warningsList = document.getElementById('warningsList');

            if (warnings.length > 0) {
                warningsList.innerHTML = warnings.map(warning => `
                    <li class="warning">${escapeHtml(warning)}</li>
                `).join('');
                warningsSection.style.display = 'block';
            }
        }

        function displayInfo(info) {
            const infoGrid = document.getElementById('infoGrid');
            let html = '';

            // Functions
            if (info.functions && info.functions.length > 0) {
                html += `
                    <div class="info-item">
                        <div class="info-label">Functions (${info.functions.length})</div>
                        <div class="info-value">${info.functions.join(', ')}</div>
                    </div>
                `;
            }

            // Decorators
            if (info.decorators && info.decorators.length > 0) {
                html += `
                    <div class="info-item">
                        <div class="info-label">Decorators (${info.decorators.length})</div>
                        <div class="info-value">${info.decorators.join(', ')}</div>
                    </div>
                `;
            } else {
                html += `
                    <div class="info-item">
                        <div class="info-label">Decorators</div>
                        <div class="info-value">None found</div>
                    </div>
                `;
            }

            // Imports
            if (info.imports && info.imports.length > 0) {
                html += `
                    <div class="info-item">
                        <div class="info-label">Imports (${info.imports.length})</div>
                        <div class="info-value">${info.imports.join(', ')}</div>
                    </div>
                `;
            }

            // Forbidden Calls
            if (info.forbidden_calls && info.forbidden_calls.length > 0) {
                html += `
                    <div class="info-item">
                        <div class="info-label">Non-Deterministic Calls (${info.forbidden_calls.length})</div>
                        <div class="info-value">${info.forbidden_calls.map(c => c.function).join(', ')}</div>
                    </div>
                `;
            }

            infoGrid.innerHTML = html || '<div class="empty-state">No additional details</div>';
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
    <script src="genlayerclient.js"></script>
    <script src="app.js"></script>
</body>

</html>
